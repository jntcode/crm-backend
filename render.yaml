services:
  - type: web
    name: crm-backend
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://crm-frontend-six-pearl.vercel.app
      - key: DB_HOST
        fromDatabase:
          name: crm-backend-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: crm-backend-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: crm-backend-db
          property: dbname
      - key: DB_USERNAME
        fromDatabase:
          name: crm-backend-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: crm-backend-db
          property: password

databases:
  - name: crm-backend-db
    plan: free
