services:
  - type: web
    name: crm-backend
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests -q
    startCommand: java -jar target/*.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: crm-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: crm-database
    plan: free
    databaseName: crmdb
